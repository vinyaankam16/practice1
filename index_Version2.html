<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Addition of Two Numbers</title>
    <style>
        body {
            background: #f7f7f7;
            display: flex;
            height: 100vh;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        .container {
            background: #fff;
            padding: 28px 32px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
            min-width: 320px;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        input[type="number"] {
            width: 100px;
            padding: 8px;
            margin: 8px 8px 8px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            padding: 9px 18px;
            background: #007bff;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
            margin-top: 10px;
        }
        button:hover {
            background: #0056b3;
        }
        .result {
            margin-top: 18px;
            font-size: 17px;
            color: #222;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Add Two Numbers</h2>
        <form id="addForm" onsubmit="return false;">
            <input type="number" id="num1" placeholder="First Number" required>
            <input type="number" id="num2" placeholder="Second Number" required>
            <button onclick="addNumbers()">Add</button>
        </form>
        <div class="result" id="result"></div>
    </div>
    <script>
        function addNumbers() {
            var n1 = parseFloat(document.getElementById('num1').value);
            var n2 = parseFloat(document.getElementById('num2').value);
            var sum = n1 + n2;
            document.getElementById('result').textContent = "Sum: " + sum;
        }
    </script>
</body>
</html>
